const lines=['Good marks matter. But does your child understand?','After school, that question can linger for parents.','School, tuition, homework: where can curiosity find space?','Sometimes a chapter ends before the idea clicks.','Asking for help can feel difficult for children.','What if learning began with a clearer foundation?','Meet IIH: school studies connected with real life.','Online classes cover the syllabus, Classes seven to ten.','Here the concept comes first, before moving on.','The aim goes beyond marks, into life skills.','A familiar tuition pattern: finish chapters and move on.','Homework goes home; reports may show marks alone.','IIH describes another route: build the concept first.','Practice and revision happen together during class.','Smaller batches make room for attention and questions.','IIH sets a maximum of thirty students per standard.','Imagine turning a difficult idea into something visible.','Short animated stories bring challenging topics into lessons.','Students watch an idea, then explain it back.','Practice happens in class, without daily homework piles.','IIH also mentions guided revision at home.','Daily revision lets children revisit what they learned.','There are two tests each week, says IIH.','Same-day analysis helps discuss mistakes while fresh.','School subjects are the base; learning goes further.','Think AI, coding, robotics and digital money basics.','Life skills include cooking, fitness, music and more.','Mentor check-ins, conversations and breathing support wellbeing.','Teachers are not doctors; professional support may be needed.','Parents deserve a clearer view of their child’s learning.','Each week, a growth graph shares three measures.','Marks, focus and confidence: a broader progress conversation.','Monthly parent meetings discuss what needs attention.','Speak directly with the teacher about your child’s needs.','Share the class, board and subjects needing help.','Choose a time for a free online demo.','A parent can sit in and watch class.','Ask about the fee before making your decision.','Call or WhatsApp the teacher. Bring your questions.','Visit the website. Meet first. Decide together as a family.'];
function patch(shortEnglish){
D.en.s=shortEnglish;
const R={index:0,start:0,elapsed:0,mode:'idle',deadline:0,actual:Array(40).fill(null),token:0,done:false,voice:'',fallback:false};
window.__iihReel=R;
const uiWords={en:{estimate:'estimated total',missing:'No compatible voice is available on this device · subtitles remain on',fallback:'No Marathi voice on this device; using the closest Hindi voice',foot:'Duration adapts to speech · subtitles always on'},hi:{estimate:'अनुमानित कुल समय',missing:'इस डिवाइस पर आवाज़ उपलब्ध नहीं है · उपशीर्षक चालू हैं',fallback:'मराठी आवाज़ नहीं मिली; निकटतम हिंदी आवाज़ इस्तेमाल हो रही है',foot:'आवाज़ के अनुसार समय · उपशीर्षक हमेशा चालू'},mr:{estimate:'अंदाजे एकूण वेळ',missing:'या उपकरणावर बोलण्याचा आवाज उपलब्ध नाही · उपशीर्षके सुरू आहेत',fallback:'मराठी आवाज उपलब्ध नाही; जवळचा हिंदी आवाज वापरला आहे',foot:'आवाजानुसार वेळ · उपशीर्षके नेहमी सुरू'}};
function countWords(s){return s.trim().split(/\s+/).filter(Boolean).length}
function estimate(i){const w=countWords(D[language].s[i]), rate=language==='en'?150:language==='hi'?135:130;return Math.max(2.5,w/rate*60+.5)}
function duration(i){return R.actual[i]===null?estimate(i):R.actual[i]}
function prefix(n){let a=0;for(let j=0;j<n;j++)a+=duration(j);return a}
function total(){return prefix(40)}
function rank(v){return /natural|neural/i.test(v.name)?3:/google/i.test(v.name)?2:1}
function best(list){return list.sort((a,b)=>rank(b)-rank(a))[0]||null}
function findVoice(){if(!('speechSynthesis' in window))return {voice:null,fallback:false};const list=speechSynthesis.getVoices();const exact=best(list.filter(v=>(v.lang||'').toLowerCase().startsWith(language)));if(exact)return {voice:exact,fallback:false};if(language==='mr'){const hi=best(list.filter(v=>(v.lang||'').toLowerCase().startsWith('hi')));if(hi)return {voice:hi,fallback:true}}return {voice:null,fallback:false}}
selectedVoice=function(){return findVoice().voice};
voiceNotice=function(){let chosen=findVoice(),note=muted?D[language].ui.muted:!chosen.voice?uiWords[language].missing:chosen.fallback?uiWords[language].fallback:'';get('notice').textContent=note;R.voice=chosen.voice?chosen.voice.name:'';R.fallback=chosen.fallback};
function showProgress(){const pre=prefix(R.index),n=R.done?total():pre+Math.max(0,R.elapsed),all=total(),shown=Math.max(all,n+.1);const slider=get('progress');slider.max=shown.toFixed(1);slider.value=Math.min(n,shown);slider.style.setProperty('--p',Math.min(100,n/shown*100)+'%');const estimateMark=R.done?'':'~';get('timer').textContent=format(n)+' / '+estimateMark+format(shown);get('beat').textContent=format(n)+' / '+estimateMark+format(shown);get('timer').title=uiWords[language].estimate;get('beat').title=uiWords[language].estimate}
paint=function(animate){const i=R.index,ui=D[language].ui;get('headline').textContent=D[language].h[i];get('sub').textContent=D[language].s[i];get('figure').innerHTML='<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">'+art[icons[i]]+'</svg>';get('cta').classList.toggle('show',i>=38);get('site').textContent=ui.site;get('call').textContent=ui.call;get('whatsapp').textContent=ui.wa;get('toggle').textContent=playing?'❚❚':'▶';get('toggle').setAttribute('aria-label',playing?ui.pause:ui.resume);get('replay').setAttribute('aria-label',ui.replay);get('sound').textContent=muted?'◖×':'◖))';get('sound').setAttribute('aria-label',muted?ui.unmute:ui.mute);get('progress').setAttribute('aria-label',ui.seek);voiceNotice();showProgress();if(animate){let r=get('reel');r.classList.remove('cut');void r.offsetWidth;r.classList.add('cut')}};
function cancelSpeech(){R.token++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function beginCut(){cancelSpeech();const token=R.token;R.elapsed=0;R.start=performance.now();R.done=false;const choice=findVoice();paint(true);if(!muted&&choice.voice&&'speechSynthesis'in window){R.mode='speaking';const u=new SpeechSynthesisUtterance(D[language].s[R.index]);u.voice=choice.voice;u.lang=choice.fallback?'hi-IN':locale[language];u.rate=1.02;u.pitch=1.03;u.onend=()=>{if(token!==R.token||!playing)return;R.mode='buffer';R.deadline=Math.max(performance.now()+500,R.start+2500)};u.onerror=()=>{if(token!==R.token||!playing)return;R.mode='reading';R.start=performance.now();R.elapsed=0;R.deadline=R.start+estimate(R.index)*1000;paint(false)};speechSynthesis.speak(u)}else{R.mode='reading';R.deadline=R.start+estimate(R.index)*1000}showProgress()}
function nextCut(now){R.actual[R.index]=Math.max(2.5,(now-R.start)/1000);if(R.index===39){playing=false;R.done=true;R.mode='done';R.elapsed=R.actual[39];cancelSpeech();paint(false);return}R.index++;beginCut()}
frame=function(now){if(playing){R.elapsed=Math.max(0,(now-R.start)/1000);if(R.actual[R.index]===null&&R.elapsed>estimate(R.index))R.actual[R.index]=R.elapsed+.5;else if(R.actual[R.index]!==null&&R.elapsed+.5>R.actual[R.index])R.actual[R.index]=R.elapsed+.5;if((R.mode==='reading'||R.mode==='buffer')&&now>=R.deadline)nextCut(now);else showProgress()}requestAnimationFrame(frame)};
setPlaying=function(v){if(v){if(R.done){R.index=0;R.actual=Array(40).fill(null);R.done=false}playing=true;beginCut()}else{playing=false;cancelSpeech();R.mode='paused';R.elapsed=0;paint(false)}};
langChoice=function(l){language=l;try{localStorage.setItem('iih-reel-language',l)}catch(e){}document.documentElement.lang=l;document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));get('select').value=l;get('startPlay').textContent=D[l].ui.play;get('startFoot').textContent=uiWords[l].foot;get('brandSub').textContent=D[l].ui.brand;for(let i=R.index;i<40;i++)R.actual[i]=null;if(started){if(playing)beginCut();else{R.elapsed=0;paint(true)}}};
get('sound').onclick=()=>{muted=!muted;R.actual[R.index]=null;if(playing)beginCut();else paint(false)};
get('replay').onclick=()=>{R.index=0;R.actual=Array(40).fill(null);R.done=false;setPlaying(true)};
get('progress').oninput=e=>{const target=Number(e.target.value);let at=0,i=0;while(i<39&&at+duration(i)<=target){at+=duration(i);i++}R.index=i;R.done=false;R.elapsed=0;for(let j=i;j<40;j++)R.actual[j]=null;if(playing)beginCut();else paint(true)};
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',()=>{voiceNotice();if(playing&&R.mode==='reading'&&!muted&&findVoice().voice)beginCut()});
langChoice(language);
}
